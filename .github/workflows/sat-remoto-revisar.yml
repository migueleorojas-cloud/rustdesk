# SAT Remoto (OfficeTech): revisión rápida del código Flutter (unos 10 minutos) antes de lanzar
# la compilación completa de Windows (~1 hora). Solo analiza; no compila ni publica nada.
# Actions → "SAT Remoto · Revisar código" → Run workflow.
name: SAT Remoto · Revisar código

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  analizar:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Analizar los archivos de SAT Remoto
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/desktop/widgets/sat_remoto.dart \
            lib/desktop/pages/desktop_home_page.dart \
            lib/desktop/pages/server_page.dart \
            lib/common.dart \
            lib/consts.dart \
            lib/main.dart
